spring.application.name=url-shortner
# Base of the generated short URLs; the short code is appended to it.
# Override per environment, e.g. APP_BASE_URL=https://sho.rt/
app.base-url=https://openshortner.com/
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://localhost:5432/url_shortner
spring.datasource.driver-class-name=org.postgresql.Driver

# A local Postgres is already running on 5432 (see datasource above), so we
# connect to it directly rather than letting spring-boot-docker-compose start
# a second, port-conflicting container. Set to true (and stop the local DB) to
# use the bundled compose.yaml instead.
spring.docker.compose.enabled=false

# Flyway owns the schema; Hibernate only validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

